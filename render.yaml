services:
  - type: web
    name: kroos-master-backend
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    # --include=dev: con NODE_ENV=production npm se salta TypeScript y el build falla.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
